# Factory on Rails, as a Docker Compose file for Railway's importer.
#
# Not for `docker compose up`: values like ${{Postgres.DATABASE_URL}} are
# Railway variable references and template functions, which Railway keeps as
# written. Use it to build the one-click template (docs/railway-template.md):
#
#   1. Create an empty project in Railway and drag this file onto its canvas.
#      The services land as staged changes; deploy them.
#   2. Check each app service's Settings against docs/railway-template.md
#      (source repo, healthcheck, web's public domain). Compose can't say all
#      of that, so the importer may leave some of it out.
#   3. Project Settings → Generate Template from Project, then in the template
#      editor make sure TOKEN_ENCRYPTION_KEY and PREVIEW_SIGNING_KEY still
#      read ${{secret(...)}}, so every deployment generates its own keys.
#
# Build and start commands are given as Railpack variables, which every
# Railway build honours, so they survive whatever the importer drops.

services:
  Postgres:
    image: ghcr.io/railwayapp-templates/postgres-ssl:17
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: railway
      POSTGRES_PASSWORD: ${{secret(32, "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789")}}
      PGDATA: /var/lib/postgresql/data/pgdata
      DATABASE_URL: postgresql://${{POSTGRES_USER}}:${{POSTGRES_PASSWORD}}@${{RAILWAY_PRIVATE_DOMAIN}}:5432/${{POSTGRES_DB}}

  # The JSON API and GitHub sign-in. Private: web reaches it over the private network.
  harness:
    build:
      context: https://github.com/shixzie/factory-on-rails.git#main
    environment:
      RAILPACK_BUILD_CMD: pnpm run build
      # Migrations first (the IaC uses a pre-deploy command for this).
      RAILPACK_START_CMD: node packages/core/dist/db.js && node apps/harness/dist/index.js
      # Your GitHub username; only these accounts can sign in, and the GitHub App must belong to one.
      ALLOWED_GITHUB_LOGINS: ""
      TOKEN_ENCRYPTION_KEY: ${{secret(43, "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789+/")}}=
      PREVIEW_SIGNING_KEY: ${{secret(64, "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789+/")}}
      DATABASE_URL: ${{Postgres.DATABASE_URL}}
      PUBLIC_URL: https://${{web.RAILWAY_PUBLIC_DOMAIN}}
      PORT: "8080"
      HOST: "::"
      SANDBOX_SNAPSHOTS: ""
    depends_on:
      - Postgres

  # The UI and the only public service; forwards /api and /auth to the harness.
  web:
    build:
      context: https://github.com/shixzie/factory-on-rails.git#main
    environment:
      RAILPACK_BUILD_CMD: pnpm run build && pnpm --filter @factory/web build
      RAILPACK_START_CMD: cd apps/web && node node_modules/next/dist/bin/next start --hostname 0.0.0.0
      HARNESS_INTERNAL_URL: http://${{harness.RAILWAY_PRIVATE_DOMAIN}}:8080
      PORT: "8080"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "8080"
    depends_on:
      - harness

  # Drives one Railway sandbox per run. No networking.
  runner:
    build:
      context: https://github.com/shixzie/factory-on-rails.git#main
    environment:
      RAILPACK_BUILD_CMD: pnpm run build
      RAILPACK_START_CMD: node apps/runner/dist/index.js
      DATABASE_URL: ${{Postgres.DATABASE_URL}}
      TOKEN_ENCRYPTION_KEY: ${{harness.TOKEN_ENCRYPTION_KEY}}
      PREVIEW_SIGNING_KEY: ${{harness.PREVIEW_SIGNING_KEY}}
      SANDBOX_SNAPSHOTS: ${{harness.SANDBOX_SNAPSHOTS}}
      HARNESS_URL: https://${{web.RAILWAY_PUBLIC_DOMAIN}}
      MAX_CONCURRENT_RUNS: "3"
    depends_on:
      - Postgres

volumes:
  postgres-data:
